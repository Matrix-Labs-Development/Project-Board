name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/americancoast-stack/txData/Qbox/resources/[your-folder]/your-resource
            git fetch origin main
            git reset --hard origin/main

            # Optional: restart just the resource through txAdmin/FiveM console method if you have one
            # Or restart the container if this is your deployment style:
            # docker compose -f /opt/americancoast-stack/docker-compose.yml restart fivem

      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"Deploy finished with status: **${STATUS}** for \`${{ github.repository }}\` on branch \`${{ github.ref_name }}\`.\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"